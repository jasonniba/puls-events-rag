
[project]
name = "puls-events-rag"
version = "1.0.0"
description = "POC RAG de recommandation d'evenements culturels a Paris"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Collecte et traitement des donnees
    "pandas",
    "numpy",
    "requests",
    "python-dotenv",

    # RAG et recherche semantique
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-huggingface",
    "langchain-text-splitters",
    "langchain-mistralai",
    "faiss-cpu",

    # Embeddings sur CPU
    "sentence-transformers==5.6.0",
    "transformers==5.10.1",

    # API REST
    "fastapi",
    "uvicorn[standard]",

    # Interface utilisateur
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
    "jupyter",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
